<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naranbat Enkhbold 78577</title>
</head>
<body>
    <h2>Counter</h2>
    <div id="box-counter">0</div>

    <div id="container-buttons">
        <button id="btn-decrement">Decrement</button>
        <button id="btn-reset">Reset</button>
        <button id="btn-increment">Increment</button>

        
    </div>
    <script>
        const containerButtons = document.getElementById('container-buttons');
        const containerValue = document.getElementById('box-counter');
        
        let counterValue = 0;
        
        containerButtons.addEventListener('click', (event) => {
        
            if (event.target.id === 'btn-increment') {
                counterValue++;
            }
            else if (event.target.id === 'btn-reset') {
                counterValue = 0;
            }
            else if (event.target.id === 'btn-decrement') {
                counterValue--;
            }
        
            containerValue.innerText = counterValue;
        
            if (counterValue > 0) {
                containerValue.style.color = "green";
            }
            else if (counterValue < 0) {
                containerValue.style.color = "red";
            }
            else {
                containerValue.style.color = "#222";
            }
        
        });
        </script>
</body>
</html>
